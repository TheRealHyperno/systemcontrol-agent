[package]
name = "systemc"
version = "1.0.0"
edition = "2021"
description = "SystemC (rust port) — personal AI agent: Discord bot, agent loop, web control panel, systemd service"

[[bin]]
name = "systemc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3"
regex = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
