<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>systemc</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0d0f;
    --surface:  #16161a;
    --border:   #2a2a30;
    --accent:   #e05c3a;
    --accent2:  #f0a070;
    --text:     #e8e6e1;
    --dim:      #6b6970;
    --green:    #4ade80;
    --yellow:   #fbbf24;
    --red:      #f87171;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Inter', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

  /* ── layout ── */
  body { display: grid; grid-template-rows: 48px 1fr 80px; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 0 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header .logo { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--accent); }
  header .model-badge {
    margin-left: auto; font-family: var(--mono); font-size: 11px;
    color: var(--dim); background: var(--bg); padding: 3px 8px;
    border: 1px solid var(--border); border-radius: 3px;
  }
  header .lang {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    padding: 3px 4px; cursor: pointer;
  }
  header .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px var(--green);
    transition: background .3s, box-shadow .3s;
  }
  header .status-dot.thinking { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1s infinite; }
  header .status-dot.error    { background: var(--red);    box-shadow: 0 0 6px var(--red); }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }

  /* ── messages ── */
  #messages {
    overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  .msg { display: flex; gap: 12px; max-width: 820px; width: 100%; }
  .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }

  .avatar {
    width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .msg.user  .avatar { background: #2a1a10; color: var(--accent); border: 1px solid var(--accent); }
  .msg.agent .avatar { background: #0f1a10; color: var(--green);  border: 1px solid #2a3a2a; }

  .bubble {
    padding: 10px 14px; border-radius: 6px; font-size: 14px;
    line-height: 1.6; max-width: 680px;
  }
  .msg.user  .bubble { background: #1a1008; border: 1px solid #3a2010; color: var(--text); }
  .msg.agent .bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text); }

  /* tool call blocks */
  .tool-block {
    margin: 8px 0; border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border); font-family: var(--mono); font-size: 12px;
  }
  .tool-header {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; background: #1a1a22; color: var(--dim);
  }
  .tool-header .tool-name { color: var(--accent2); font-weight: 600; }
  .tool-header .tool-status { margin-left: auto; font-size: 10px; }
  .tool-header .tool-status.running { color: var(--yellow); }
  .tool-header .tool-status.done    { color: var(--green); }
  .tool-header .tool-status.error   { color: var(--red); }
  .tool-body { padding: 8px 10px; background: #0f0f13; color: #a0a8b8; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
  .tool-args { padding: 5px 10px; background: #13131a; color: var(--dim); border-top: 1px solid var(--border); font-size: 11px; }

  /* approval prompt */
  .approval-block {
    margin: 8px 0; border: 1px solid var(--yellow); border-radius: 4px; overflow: hidden;
  }
  .approval-header { padding: 8px 12px; background: #1a1500; color: var(--yellow); font-family: var(--mono); font-size: 12px; }
  .approval-cmd    { padding: 8px 12px; background: #0f0f00; font-family: var(--mono); font-size: 12px; color: var(--text); white-space: pre-wrap; }
  .approval-btns   { display: flex; gap: 8px; padding: 8px 12px; background: #0f0f00; }
  .btn-approve { padding: 5px 16px; background: #143d14; color: var(--green); border: 1px solid var(--green); border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
  .btn-deny    { padding: 5px 16px; background: #3d1414; color: var(--red);   border: 1px solid var(--red);   border-radius: 3px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
  .btn-approve:hover { background: #1e5a1e; }
  .btn-deny:hover    { background: #5a1e1e; }

  /* inline code */
  code { font-family: var(--mono); font-size: 12px; background: #1a1a22; padding: 1px 5px; border-radius: 3px; color: var(--accent2); }
  pre  { font-family: var(--mono); font-size: 12px; background: #0f0f13; padding: 10px; border-radius: 4px; overflow-x: auto; color: #a0a8b8; margin: 6px 0; }

  /* ── input ── */
  #input-row {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 14px 20px; border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #input {
    flex: 1; resize: none; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; font-family: var(--sans); font-size: 14px;
    line-height: 1.5; max-height: 120px; overflow-y: auto;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    padding: 10px 18px; background: var(--accent); color: #fff;
    border: none; border-radius: 6px; font-family: var(--mono);
    font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    transition: background .15s;
  }
  #send:hover    { background: #c84a28; }
  #send:disabled { background: var(--border); color: var(--dim); cursor: not-allowed; }

  /* clear btn */
  #clear { padding: 10px 12px; background: transparent; color: var(--dim); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; }
  #clear:hover { color: var(--text); border-color: var(--text); }

  /* streaming cursor */
  .cursor::after { content: '▋'; animation: blink .7s infinite; color: var(--accent); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* scrollbar */
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <span style="font-size:16px">🦞</span>
  <span class="logo">systemc</span>
  <span class="model-badge" id="model-badge">loading...</span>
  <div class="status-dot" id="status-dot" title="ready"></div>
  <select class="lang" id="lang" aria-label="Language">
    <option value="en">🌐 International</option>
    <option value="en-GB">🎩 Traditional</option>
    <option value="en-CA">🍁 Canadian</option>
    <option value="en-US">🦅 AMERICAN</option>
    <option value="fr">🌐 Français</option>
  </select>
</header>

<div id="messages"></div>

<div id="input-row">
  <button id="clear" title="Clear chat">↺</button>
  <textarea id="input" placeholder="Talk to your agent..." rows="1"></textarea>
  <button id="send">send</button>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const TOOL_SERVER = 'http://localhost:7842';

// ── Language (English / Français) ─────────────────────────────────────────
const I18N = {
  en: {
    loading: 'loading...', offline: 'server offline', ready: 'ready',
    clear: 'Clear chat', placeholder: 'Talk to your agent...', send: 'send',
    you: 'you', claw: 'claw', running: 'running...', error: 'error', done: 'done',
    truncated: '...[truncated]', elevated: '🔴 ELEVATED (sudo)', approval: '⚠️ Approval required',
    runit: '✅ Run it', cancel: '❌ Cancel', approved: '✅ approved', denied: '❌ denied',
    errorPrefix: 'Error',
    unreachable: '⚠️ Could not reach the systemc server. Run <code>python webui_server.py</code> first.',
  },
  fr: {
    loading: 'chargement...', offline: 'serveur hors ligne', ready: 'prêt',
    clear: 'Effacer la discussion', placeholder: 'Parle à ton agent...', send: 'envoyer',
    you: 'toi', claw: 'claw', running: 'en cours...', error: 'erreur', done: 'terminé',
    truncated: '...[tronqué]', elevated: '🔴 ÉLEVÉ (sudo)', approval: '⚠️ Approbation requise',
    runit: '✅ Exécuter', cancel: '❌ Annuler', approved: '✅ approuvé', denied: '❌ refusé',
    errorPrefix: 'Erreur',
    unreachable: '⚠️ Impossible de joindre le serveur systemc. Lance d\'abord <code>python webui_server.py</code>.',
  },
};
// Traditional (UK) tweaks a few strings; Canadian is, as established, the UK words.
I18N['en-GB'] = {
  loading: 'having a look...', ready: 'all sorted', placeholder: 'Have a word with your agent...',
  error: 'oops', offline: 'server offline — tried turning it off and on again?',
  unreachable: '⚠️ Couldn\'t reach the systemc server. Run <code>python webui_server.py</code> first, there\'s a good chap.',
};
I18N['en-CA'] = I18N['en-GB'];
// American: every string, at full volume.
I18N['en-US'] = {
  loading: '🦅 loading freedom...', offline: '🦅 SERVER OFFLINE (A BALD EAGLE WEEPS)', ready: 'LOCKED AND LOADED',
  clear: 'CLEAR CHAT (FRESH START, AMERICAN-STYLE)', placeholder: 'Speak your mind to your agent...',
  send: 'SEND IT 🦅', you: 'you', claw: 'USA', running: 'LAUNCHING...', error: 'ERROR', done: 'MISSION ACCOMPLISHED',
  truncated: '...[TRUNCATED, LIKE A BUDGET]', elevated: '🔴 ELEVATED (SUDO — WITH GREAT POWER...)',
  approval: '⚠️ PERMISSION SLIP REQUIRED', runit: '✅ SEND IT', cancel: '❌ ABORT MISSION',
  approved: '✅ APPROVED (YEA)', denied: '❌ DENIED (NAY)', errorPrefix: 'ERROR',
  unreachable: '⚠️ The systemc server is MIA. Run <code>python webui_server.py</code> first, soldier.',
};
function detectLang() {
  const n = (navigator.language || 'en').toLowerCase();   // never auto-picks the American one
  if (n.startsWith('fr')) return 'fr';
  if (n === 'en-gb') return 'en-GB';
  if (n === 'en-ca') return 'en-CA';
  return 'en';
}
let LANG = 'en';
try { LANG = localStorage.getItem('systemc_lang') || detectLang(); } catch (e) { LANG = detectLang(); }
if (!I18N[LANG]) LANG = 'en';
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
let MODEL = 'qwen2.5';
let history = [];

const SYSTEM_PROMPT = `You are a personal AI agent with full shell and filesystem access, talking to your owner via a web UI.

## Capabilities
- run_shell: execute any shell command as the current user
- run_shell_elevated: execute with sudo (root) — always shown to user for approval first
- run_python: run a Python snippet with the bot's own interpreter — prefer this over run_shell for anything beyond a one-liner
- read_file / write_file / list_dir: workspace filesystem access
- web_search: search the web for current info (returns title/url/snippet)

## How to use shell correctly
- run_shell returns {stdout, exit_code, cwd} — check exit_code != 0 for errors
- If run_shell fails with Permission denied, retry with run_shell_elevated
- Chain commands with && not ; so failures stop the chain

## Behaviour
- Be concise. Don't narrate every step unless asked.
- If a command fails, show the relevant error and suggest a fix.
- Never claim you can't run something — try it.`;

const TOOL_SCHEMAS = [
  {
    type: 'function',
    function: {
      name: 'run_shell',
      description: 'Run a shell command as the current user. Returns stdout, exit_code, cwd.',
      parameters: { type: 'object', properties: { command: { type: 'string' } }, required: ['command'] }
    }
  },
  {
    type: 'function',
    function: {
      name: 'run_shell_elevated',
      description: 'Run a shell command with sudo (root). Always shown to user for approval first.',
      parameters: { type: 'object', properties: { command: { type: 'string' } }, required: ['command'] }
    }
  },
  {
    type: 'function',
    function: {
      name: 'read_file',
      description: 'Read a file from the workspace.',
      parameters: { type: 'object', properties: { path: { type: 'string' } }, required: ['path'] }
    }
  },
  {
    type: 'function',
    function: {
      name: 'write_file',
      description: 'Write text to a file (overwrites).',
      parameters: { type: 'object', properties: { path: { type: 'string' }, content: { type: 'string' } }, required: ['path', 'content'] }
    }
  },
  {
    type: 'function',
    function: {
      name: 'list_dir',
      description: 'List files in a directory.',
      parameters: { type: 'object', properties: { path: { type: 'string' } } }
    }
  },
  {
    type: 'function',
    function: {
      name: 'run_python',
      description: 'Run a Python snippet with the bot\'s own interpreter. Returns stdout, exit_code, cwd.',
      parameters: { type: 'object', properties: { code: { type: 'string' } }, required: ['code'] }
    }
  },
  {
    type: 'function',
    function: {
      name: 'web_search',
      description: 'Search the web. Returns a list of {title, url, snippet} results.',
      parameters: { type: 'object', properties: { query: { type: 'string' }, max_results: { type: 'integer' } }, required: ['query'] }
    }
  }
];

// ── Destructive detection (mirrors tools.py) ─────────────────────────────
const DESTRUCTIVE_RE = /(?:^|[|;&`(]\s*)(?:sudo\s+)?(rm|rmdir|shred|mkfs|fdisk|parted|wipefs|dd|shutdown|reboot|halt|poweroff|sudo|su|pip3?|apt(?:-get)?|dpkg|snap|flatpak|npm|yarn|pnpm|systemctl|service|chown|chmod|iptables|ip6tables|ufw|nft|kill|killall|pkill|del|erase|format|diskpart|cipher|remove-item|clear-disk|stop-computer|restart-computer|reg|taskkill|net)\b/im;
const PIPE_SHELL_RE = /\|\s*(ba)?sh\b|\|\s*(iex|invoke-expression)\b/i;
function isDestructive(cmd) { return DESTRUCTIVE_RE.test(cmd) || PIPE_SHELL_RE.test(cmd); }

// ── DOM helpers ───────────────────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send');
const statusDot  = document.getElementById('status-dot');
const modelBadge = document.getElementById('model-badge');

function setStatus(s) {
  statusDot.className = 'status-dot' + (s ? ' ' + s : '');
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, contentEl) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? t('you') : t('claw');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (typeof contentEl === 'string') {
    bubble.innerHTML = renderText(contentEl);
  } else {
    bubble.appendChild(contentEl);
  }
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollBottom();
  return bubble;
}

function renderText(text) {
  // code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${escHtml(code.trim())}</code></pre>`);
  // inline code
  text = text.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
  // newlines
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function makeToolBlock(name, argsStr) {
  const block = document.createElement('div');
  block.className = 'tool-block';
  block.innerHTML = `
    <div class="tool-header">
      <span>⚙</span>
      <span class="tool-name">${escHtml(name)}</span>
      <span class="tool-status running" data-status>${t('running')}</span>
    </div>
    <div class="tool-args">${escHtml(argsStr)}</div>
    <div class="tool-body" data-body></div>`;
  return block;
}

function updateToolBlock(block, result, isError) {
  const statusEl = block.querySelector('[data-status]');
  const bodyEl   = block.querySelector('[data-body]');
  statusEl.textContent = isError ? t('error') : t('done');
  statusEl.className = `tool-status ${isError ? 'error' : 'done'}`;
  const text = typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result);
  bodyEl.textContent = text.length > 2000 ? text.slice(-2000) + '\n' + t('truncated') : text;
}

// ── Approval gate ─────────────────────────────────────────────────────────
function requestApproval(command, isElevated) {
  return new Promise(resolve => {
    const block = document.createElement('div');
    block.className = 'approval-block';
    block.innerHTML = `
      <div class="approval-header">
        ${isElevated ? t('elevated') : t('approval')}
      </div>
      <div class="approval-cmd">${escHtml(command)}</div>
      <div class="approval-btns">
        <button class="btn-approve">${t('runit')}</button>
        <button class="btn-deny">${t('cancel')}</button>
      </div>`;
    const bubble = addMessage('agent', block);
    block.querySelector('.btn-approve').onclick = () => {
      block.querySelector('.approval-btns').innerHTML = '<span style="color:var(--green);font-family:var(--mono);font-size:12px">' + t('approved') + '</span>';
      resolve(true);
    };
    block.querySelector('.btn-deny').onclick = () => {
      block.querySelector('.approval-btns').innerHTML = '<span style="color:var(--red);font-family:var(--mono);font-size:12px">' + t('denied') + '</span>';
      resolve(false);
    };
    scrollBottom();
  });
}

// ── Tool execution ────────────────────────────────────────────────────────
async function executeTool(name, args, agentBubble) {
  const argsStr = JSON.stringify(args);
  const toolBlock = makeToolBlock(name, argsStr);
  agentBubble.appendChild(toolBlock);
  scrollBottom();

  // Elevated always needs approval; destructive shell also needs it
  const needsApproval = name === 'run_shell_elevated' ||
    (name === 'run_shell' && isDestructive(args.command || ''));

  if (needsApproval) {
    const approved = await requestApproval(args.command || argsStr, name === 'run_shell_elevated');
    if (!approved) {
      const result = { error: 'denied by user', exit_code: -1 };
      updateToolBlock(toolBlock, result, true);
      return result;
    }
  }

  try {
    const resp = await fetch(`${TOOL_SERVER}/tools/${name}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
    const result = await resp.json();
    updateToolBlock(toolBlock, result, !!result.error);
    return result;
  } catch (e) {
    const result = { error: String(e) };
    updateToolBlock(toolBlock, result, true);
    return result;
  }
}

// ── Agent loop ────────────────────────────────────────────────────────────
async function runAgentTurn(userText) {
  sendBtn.disabled = true;
  setStatus('thinking');

  history.push({ role: 'user', content: userText });

  const agentBubble = addMessage('agent', document.createElement('span'));
  let textSpan = agentBubble.querySelector('span') || agentBubble;
  textSpan.classList.add('cursor');
  let accText = '';

  const MAX_TURNS = 12;
  for (let turn = 0; turn < MAX_TURNS; turn++) {
    // Build Ollama messages
    const messages = [
      { role: 'system', content: SYSTEM_PROMPT },
      ...history,
    ];

    let fullContent = '';
    let toolCallsRaw = [];
    let buffer = '';

    try {
      const resp = await fetch(`${TOOL_SERVER}/ollama/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: MODEL,
          messages,
          tools: TOOL_SCHEMAS,
          stream: true,
        }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const obj = JSON.parse(line);
            const msg = obj.message || {};

            // Accumulate text
            if (msg.content) {
              fullContent += msg.content;
              accText += msg.content;
              textSpan.innerHTML = renderText(accText);
              textSpan.classList.add('cursor');
              scrollBottom();
            }

            // Collect tool calls
            if (msg.tool_calls) {
              toolCallsRaw = toolCallsRaw.concat(msg.tool_calls);
            }

            if (obj.done && obj.message?.tool_calls) {
              toolCallsRaw = toolCallsRaw.concat(obj.message.tool_calls);
            }
          } catch (_) {}
        }
      }
    } catch (e) {
      textSpan.classList.remove('cursor');
      textSpan.innerHTML += `<br><span style="color:var(--red)">${t('errorPrefix')}: ${escHtml(String(e))}</span>`;
      break;
    }

    textSpan.classList.remove('cursor');

    // No tool calls → done
    if (!toolCallsRaw.length) {
      history.push({ role: 'assistant', content: fullContent });
      break;
    }

    // Execute tool calls
    history.push({ role: 'assistant', content: fullContent, tool_calls: toolCallsRaw });

    for (const tc of toolCallsRaw) {
      const name = tc.function?.name || tc.name;
      const args = tc.function?.arguments || tc.input || {};
      const result = await executeTool(name, args, agentBubble);
      history.push({
        role: 'tool',
        content: JSON.stringify(result),
        name,
      });
    }

    toolCallsRaw = [];
    accText = '';
    // Add a fresh text span for the next turn's output and just point
    // textSpan at it directly — it's a `let` in this function's scope,
    // so plain reassignment works fine (no need for the innerHTML proxy
    // hack this used to do, which left classList calls like cursor
    // add/remove operating on the stale old span).
    const nextSpan = document.createElement('span');
    agentBubble.appendChild(nextSpan);
    textSpan = nextSpan;
  }

  setStatus('');
  sendBtn.disabled = false;
  inputEl.focus();
}

// ── Send ──────────────────────────────────────────────────────────────────
async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMessage('user', text);
  await runAgentTurn(text);
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

document.getElementById('clear').addEventListener('click', () => {
  history = [];
  messagesEl.innerHTML = '';
});

// ── Apply language ────────────────────────────────────────────────────────
let badgeKey = 'loading';          // which message the model badge is showing (null = model name)
function applyLang() {
  document.documentElement.lang = LANG;
  document.getElementById('lang').value = LANG;
  inputEl.placeholder = t('placeholder');
  sendBtn.textContent = t('send');
  document.getElementById('clear').title = t('clear');
  statusDot.title = t('ready');
  if (badgeKey) modelBadge.textContent = t(badgeKey);
}
document.getElementById('lang').addEventListener('change', e => {
  LANG = e.target.value;
  try { localStorage.setItem('systemc_lang', LANG); } catch (err) {}
  applyLang();
});

// ── Init ──────────────────────────────────────────────────────────────────
(async () => {
  try {
    const cfg = await fetch(`${TOOL_SERVER}/config`).then(r => r.json());
    MODEL = cfg.model || MODEL;
    badgeKey = null;
    modelBadge.textContent = MODEL;
  } catch (e) {
    badgeKey = 'offline';
    modelBadge.textContent = t('offline');
    setStatus('error');
    addMessage('agent', t('unreachable'));
  }
})();
applyLang();
</script>
</body>
</html>
